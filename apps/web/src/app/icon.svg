<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Quantocos">
  <!-- Favicon: the Quantocos ring, drawn from the same spectrum as the wordmark. -->
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8800" />
      <stop offset="30%" stop-color="#FFDD00" />
      <stop offset="55%" stop-color="#00DDAA" />
      <stop offset="78%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#7B00FF" />
    </linearGradient>
    <radialGradient id="chrome" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#C9D3E0" />
      <stop offset="100%" stop-color="#7C8698" />
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#080B12" />
  <circle cx="16" cy="16" r="9.4" fill="none" stroke="url(#spec)" stroke-width="3.2" stroke-linecap="round" />
  <circle cx="22.6" cy="22.6" r="2.6" fill="url(#chrome)" />
</svg>
