<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-label="Three pods stacked on one credit pool, with a published price and an invoice">
  <defs>
    <radialGradient id="pr-glow" cx="52%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#C9911A" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#C9911A" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="pr-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2D582" stop-opacity="0.57"/>
      <stop offset="100%" stop-color="#F2D582" stop-opacity="0.13"/>
    </linearGradient>
    <linearGradient id="pr-gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9911A"/>
      <stop offset="100%" stop-color="#F2D582"/>
    </linearGradient>
  </defs>

  <ellipse cx="520" cy="230" rx="390" ry="235" fill="url(#pr-glow)"/>

  <!-- the pods, stacking upward: each plate carries the one below it -->
  <g stroke="#F2D582" stroke-linecap="round" stroke-linejoin="round">
    <g fill="url(#pr-plate)" stroke-opacity="0.92" stroke-width="2">
      <path d="M150 372 h208 a10 10 0 0 1 10 10 v18 a10 10 0 0 1-10 10 h-208 a10 10 0 0 1-10-10 v-18 a10 10 0 0 1 10-10 z"/>
    </g>
    <g fill="url(#pr-plate)" stroke-opacity="0.92" stroke-width="2">
      <path d="M176 306 h186 a10 10 0 0 1 10 10 v18 a10 10 0 0 1-10 10 h-186 a10 10 0 0 1-10-10 v-18 a10 10 0 0 1 10-10 z"/>
    </g>
    <g fill="url(#pr-plate)" stroke-opacity="0.92" stroke-width="2.2">
      <path d="M204 240 h164 a10 10 0 0 1 10 10 v18 a10 10 0 0 1-10 10 h-164 a10 10 0 0 1-10-10 v-18 a10 10 0 0 1 10-10 z"/>
    </g>

    <!-- the pool line that all three draw from -->
    <path d="M140 430 h420" stroke-opacity="0.91" stroke-width="2"/>
    <path d="M150 386 v40" stroke-opacity="0.78"/>
    <path d="M286 320 v66" stroke-opacity="0.78"/>
    <path d="M358 254 v66" stroke-opacity="0.78"/>

    <!-- plate detail: one credit bar per tier, growing -->
    <g stroke-opacity="0.92" stroke-width="2">
      <path d="M170 396 h64"/><path d="M196 330 h92"/><path d="M224 264 h118"/>
    </g>
  </g>

  <!-- the pool gauge -->
  <g transform="translate(556 236)">
    <path d="M-64 0 a64 64 0 0 1 128 0" fill="none" stroke="#F2D582" stroke-opacity="0.73" stroke-width="2"/>
    <path d="M-64 0 a64 64 0 0 1 96-52" fill="none" stroke="url(#pr-gauge)" stroke-width="3.4" stroke-linecap="round"/>
    <g stroke="#F2D582" stroke-opacity="0.92" stroke-width="2" stroke-linecap="round">
      <path d="M-64 0 v-9"/><path d="M-32 -55 l-5 -8"/><path d="M32 -55 l5 -8"/><path d="M64 0 v-9"/>
    </g>
    <circle cx="0" cy="0" r="4.5" fill="#F2D582"/>
    <path d="M0 0 L44 -34" stroke="#F2D582" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- the published price tag -->
  <g transform="translate(700 96)">
    <path d="M0 0 h96 a10 10 0 0 1 10 10 v34 a10 10 0 0 1-10 10 h-88 l-26-27 z"
          fill="#F2D582" fill-opacity="0.26" stroke="#F2D582" stroke-opacity="0.92" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="22" cy="27" r="5" fill="none" stroke="#F2D582" stroke-opacity="0.92" stroke-width="2"/>
    <path d="M40 20 h44" stroke="#F2D582" stroke-opacity="0.92" stroke-width="2" stroke-linecap="round"/>
    <path d="M40 34 h28" stroke="#F2D582" stroke-opacity="0.83" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- the invoice, per tenant -->
  <g transform="translate(596 300)">
    <path d="M0 0 h190 a12 12 0 0 1 12 12 v128 a12 12 0 0 1-12 12 h-190 a12 12 0 0 1-12-12 v-128 a12 12 0 0 1 12-12 z"
          fill="url(#pr-plate)" stroke="#F2D582" stroke-opacity="0.92" stroke-width="2"/>
    <g stroke="#F2D582" stroke-linecap="round">
      <path d="M14 34 h120" stroke-opacity="0.92" stroke-width="2"/>
      <path d="M14 58 h150" stroke-opacity="0.73" stroke-width="2"/>
      <path d="M14 78 h130" stroke-opacity="0.73" stroke-width="2"/>
      <path d="M14 98 h158" stroke-opacity="0.73" stroke-width="2"/>
      <path d="M14 118 h96" stroke-opacity="0.73" stroke-width="2"/>
    </g>
    <path d="M14 138 h162" stroke="#F2D582" stroke-opacity="0.92" stroke-width="2"/>
    <path d="M126 152 q6 10 18 0" fill="none" stroke="#C9911A" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- the pool, drawn as one measured run of credits -->
  <g stroke="#F2D582" stroke-linecap="round">
    <path d="M140 470 h300" stroke-opacity="0.57" stroke-width="2"/>
    <path d="M140 470 h214" stroke="url(#pr-gauge)" stroke-width="3"/>
    <path d="M140 470 v-9" stroke-opacity="0.92" stroke-width="2"/>
    <path d="M354 470 v-9" stroke-opacity="0.92" stroke-width="2"/>
    <circle cx="354" cy="470" r="4" fill="#F2D582" stroke="none"/>
  </g>
</svg>
