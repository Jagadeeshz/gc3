<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-label="A pod of five specialists working around one table under a single idea">
  <defs>
    <radialGradient id="hf-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="hf-bulb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A86FF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="hf-table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A86FF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9A86FF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <ellipse cx="560" cy="210" rx="380" ry="240" fill="url(#hf-glow)"/>

  <!-- the one idea -->
  <g stroke="#9A86FF" stroke-opacity="0.92" stroke-width="2" stroke-linecap="round">
    <path d="M604 52 v-20"/><path d="M676 52 v-20"/><path d="M640 34 v-18"/>
    <path d="M568 88 l-16-12"/><path d="M712 88 l16-12"/>
  </g>
  <g>
    <path d="M604 118 a36 36 0 1 1 72 0 c0 16-11 24-14 38 h-44 c-3-14-14-22-14-38 z"
          fill="url(#hf-bulb)" fill-opacity="0.42" stroke="url(#hf-bulb)" stroke-width="2.4"/>
    <path d="M626 162 h28 v10 a6 6 0 0 1-6 6 h-16 a6 6 0 0 1-6-6 z"
          fill="none" stroke="#22D3EE" stroke-width="2.2"/>
    <path d="M628 118 q12-14 24 0 q-10 12-24 0" fill="none" stroke="#9A86FF" stroke-width="2"/>
  </g>

  <!-- the pod, at one table -->
  <g fill="none" stroke="#9A86FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- five seats -->
    <g opacity="0.92">
      <circle cx="150" cy="286" r="24" fill="#9A86FF" fill-opacity="0.26"/>
      <path d="M112 372 q0-46 38-46 q38 0 38 46" fill="#9A86FF" fill-opacity="0.21"/>
    </g>
    <g opacity="0.92">
      <circle cx="322" cy="272" r="26" fill="#9A86FF" fill-opacity="0.31"/>
      <path d="M280 372 q0-52 42-52 q42 0 42 52" fill="#9A86FF" fill-opacity="0.26"/>
    </g>
    <g opacity="0.92">
      <circle cx="500" cy="268" r="27" fill="#9A86FF" fill-opacity="0.36"/>
      <path d="M456 372 q0-56 44-56 q44 0 44 56" fill="#9A86FF" fill-opacity="0.31"/>
    </g>
    <g opacity="0.92">
      <circle cx="672" cy="278" r="25" fill="#9A86FF" fill-opacity="0.31"/>
      <path d="M632 372 q0-50 40-50 q40 0 40 50" fill="#9A86FF" fill-opacity="0.26"/>
    </g>
    <g opacity="0.92">
      <circle cx="816" cy="292" r="23" fill="#9A86FF" fill-opacity="0.26"/>
      <path d="M780 372 q0-44 36-44 q36 0 36 44" fill="#9A86FF" fill-opacity="0.21"/>
    </g>
  </g>

  <!-- the work in the air: brief, evidence, decision -->
  <g stroke="#9A86FF" stroke-width="1.8" stroke-linecap="round" fill="none">
    <rect x="292" y="196" width="72" height="52" rx="8" stroke-opacity="0.92" fill="#9A86FF" fill-opacity="0.13"/>
    <path d="M304 214 h44" stroke-opacity="0.92"/>
    <path d="M304 228 h30" stroke-opacity="0.78"/>

    <rect x="392" y="150" width="66" height="46" rx="8" stroke-opacity="0.92" fill="#9A86FF" fill-opacity="0.13"/>
    <path d="M404 168 h38" stroke-opacity="0.92"/>
    <path d="M404 182 h24" stroke-opacity="0.73"/>

    <rect x="700" y="168" width="78" height="54" rx="8" stroke-opacity="0.92" fill="#9A86FF" fill-opacity="0.13"/>
    <path d="M712 188 h50" stroke-opacity="0.92"/>
    <path d="M712 202 h34" stroke-opacity="0.78"/>
    <circle cx="764" cy="188" r="4" fill="#22D3EE" stroke="none" opacity="0.92"/>
  </g>

  <!-- the table -->
  <rect x="96" y="372" width="736" height="26" rx="13" fill="url(#hf-table)" stroke="#9A86FF" stroke-opacity="0.92" stroke-width="2"/>
  <g stroke="#9A86FF" stroke-opacity="0.73" stroke-width="2" stroke-linecap="round">
    <path d="M180 398 v54"/><path d="M300 398 v54"/><path d="M620 398 v54"/><path d="M750 398 v54"/>
  </g>

  <!-- laptops -->
  <g stroke="#9A86FF" stroke-opacity="0.92" stroke-width="1.8" fill="none" stroke-linejoin="round">
    <path d="M236 372 l14-30 h54 l14 30"/>
    <path d="M352 372 l14-30 h54 l14 30"/>
  </g>

  <!-- notes on the surface -->
  <g fill="#9A86FF" stroke="none">
    <rect x="470" y="360" width="18" height="12" rx="2" opacity="0.92"/>
    <rect x="496" y="360" width="18" height="12" rx="2" opacity="0.73"/>
    <rect x="522" y="360" width="18" height="12" rx="2" opacity="0.92"/>
    <rect x="548" y="360" width="18" height="12" rx="2" opacity="0.57"/>
  </g>

  <!-- the reading line under the table -->
  <path d="M96 470 h736" stroke="#9A86FF" stroke-opacity="0.47" stroke-width="2" stroke-linecap="round"/>
</svg>
