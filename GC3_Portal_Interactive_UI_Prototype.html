<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GC3 Portal — Interactive UI Prototype</title>
<style>
:root{--navy:#0b1525;--navy2:#14243a;--blue:#2463a6;--ink:#182638;--muted:#718096;--line:#e5eaf0;--bg:#f5f7fa;--white:#fff;--green:#16865b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--navy);color:#e8eef6;padding:18px 14px;display:flex;flex-direction:column;min-height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:3px 8px 20px;border-bottom:1px solid #26364c}.brandmark{width:38px;height:38px;border-radius:11px;background:#173a65;display:grid;place-items:center;font-size:22px;font-weight:800}.brand small{display:block;color:#93a9c4;font-size:9px;letter-spacing:1px}
.rolebox{padding:17px 4px 14px}.eyebrow{font-size:10px;letter-spacing:1px;font-weight:700;color:#8da2bb;margin-bottom:8px}.rolebox select{width:100%;background:#1a2b40;color:white;border:1px solid #35485e;border-radius:8px;padding:10px}
.navlabel{font-size:10px;letter-spacing:1px;color:#8297af;font-weight:700;padding:12px 9px 7px}.nav{display:grid;gap:3px}.nav button{background:transparent;color:#b5c2d2;border:0;text-align:left;padding:10px 11px;border-radius:7px;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:#1b3656;color:white}.nav .ico{width:18px;text-align:center;color:#93a9c4}.sidefoot{margin-top:auto;border-top:1px solid #26364c;padding:15px 8px 3px;color:#93a9c4;font-size:11px}
.main{min-width:0}.topbar{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:3}.topright{display:flex;gap:15px;align-items:center;color:#64748b}.avatar{width:32px;height:32px;border-radius:50%;background:#e6edf5;display:grid;place-items:center;color:#294b70;font-weight:700}
.content{max-width:1300px;margin:auto;padding:28px 30px 60px}.crumb{font-size:10px;color:#8491a3;letter-spacing:1px;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin:7px 0 23px}.heading h1{font-size:27px;margin:0 0 4px;letter-spacing:-.6px}.sub{color:var(--muted)}.tag{font-size:10px;border-radius:20px;padding:5px 9px;background:#e7f5ed;color:#13774e;font-weight:700;white-space:nowrap}
.searchrow{display:flex;gap:10px;margin-bottom:20px}.searchrow input{max-width:380px;flex:1}.field,input,select,textarea{border:1px solid var(--line);border-radius:8px;background:white;padding:10px 12px;color:var(--ink);width:100%;outline:none}.field:focus,input:focus,select:focus,textarea:focus{border-color:#6b9acb;box-shadow:0 0 0 3px #dceafa}
.btn{border:1px solid #d8e0e9;background:white;color:#334155;border-radius:8px;padding:9px 13px;font-weight:600}.btn.primary{background:#174c80;color:white;border-color:#174c80}.btn:hover{filter:brightness(.97)}.btn.small{padding:6px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:17px 0}.metric,.panel,.record,.service{background:white;border:1px solid var(--line);border-radius:12px}.metric{padding:17px}.metric .label{font-size:12px;color:var(--muted)}.metric strong{display:block;font-size:27px;margin:7px 0 3px}.metric small{color:#16865b}.panel{padding:18px;margin-top:15px}.panel h3{font-size:15px;margin:0 0 14px}.activity{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.activity:last-child{border:0}.fileicon{width:36px;height:36px;border-radius:9px;background:#edf3f9;display:grid;place-items:center;color:#315b83}.activity .desc{flex:1}.activity small{display:block;color:var(--muted);margin-top:2px}.status{font-size:10px;font-weight:700;border-radius:20px;padding:5px 8px;background:#edf3fa;color:#315b83}.status.green{background:#e7f5ed;color:#13774e}.status.amber{background:#fff4df;color:#956313}.twocol{display:grid;grid-template-columns:1.3fr 1fr;gap:15px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.recordlist{display:grid;gap:10px}.record{padding:15px}.recordtop,.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.record h3{font-size:14px;margin:9px 0 4px}.muted{color:var(--muted);font-size:12px}.recordfoot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;gap:10px}.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.service{padding:16px;display:flex;gap:12px;align-items:flex-start}.service .symbol{width:40px;height:40px;border-radius:10px;background:#edf3f9;display:grid;place-items:center;font-size:19px}.service p{margin:4px 0 0;color:var(--muted);font-size:12px}.formbox{display:grid;gap:10px;max-width:650px}.formbox label{font-size:12px;color:#64748b;font-weight:600;display:grid;gap:5px}.notice{padding:11px 13px;background:#edf5fc;border:1px solid #d4e6f5;color:#28577e;border-radius:8px;margin-bottom:15px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:white;padding:7px 11px;border-radius:7px;color:#64748b}.tabs button.active{background:#eaf2fa;color:#174c80;border-color:#c9dced}
@media(max-width:900px){.app{grid-template-columns:210px 1fr}.grid{grid-template-columns:repeat(2,1fr)}.content{padding:22px 18px}}
@media(max-width:650px){.app{display:block}.sidebar{min-height:auto;padding:12px}.brand{padding-bottom:10px}.rolebox{padding:10px 4px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.navlabel,.sidefoot{display:none}.topbar{height:52px;padding:0 15px}.content{padding:20px 13px}.grid{gap:8px}.metric{padding:12px}.metric strong{font-size:23px}.twocol,.services{grid-template-columns:1fr}.heading h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">G</div><div><b>GC3</b><small>GLOBAL CREATIVE CAPABILITY</small></div></div>
  <div class="rolebox"><div class="eyebrow">SELECT USER PERSONA</div><select id="role"></select></div>
  <div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"></nav>
  <div class="sidefoot">◈ Quantocos GC3 Platform<br>Application preview · v1.0</div>
</aside>
<main class="main">
  <header class="topbar"><b id="toprole">Client Owner</b><div class="topright"><span>♧ Notifications</span><div class="avatar">A</div></div></header>
  <section class="content">
    <div class="crumb" id="crumb">GC3 WORKSPACE / CLIENT OWNER</div>
    <div class="heading"><div><h1 id="title">Overview</h1><div class="sub" id="subtitle">Your business at a glance</div></div><span class="tag">DEMO ENVIRONMENT</span></div>
    <div class="searchrow"><input id="search" placeholder="Search workspace..."><button class="btn" id="notify">♧</button></div>
    <div id="notice"></div>
    <div id="view"></div>
  </section>
</main>
</div>
<script>
const roles={
"Client Owner":["Overview","My Subscription","Services","Service Requests","Projects","Deliverables","My Pod","Messages","Team Members","Billing & Invoices","Knowledge Centre","Support","Settings"],
"Client Member":["Overview","Services","Service Requests","My Projects","Deliverables","Messages","Knowledge Centre","Support","My Profile"],
"Pod Member":["My Workspace","My Tasks","Assigned Projects","Client Accounts","Deliverables","Messages","Time & Utilization","Knowledge Centre","My Profile"],
"Pod Manager":["Overview","My Pod","Client Accounts","Service Requests","Projects","Task Allocation","Deliverables","Team Performance","Capacity","Messages","Reports","Settings"],
"Sales Manager":["Overview","Leads","Companies","Opportunities","Proposals","Subscriptions","Client Onboarding","Renewals","Sales Reports","Settings"],
"Operations Manager":["Overview","Client Accounts","Pod Management","Service Requests","Projects","Workforce","Capacity Planning","SLA & Delivery","Quality & Feedback","Reports","Settings"],
"Management":["Executive Overview","Revenue","Subscriptions","Clients","Sales Performance","Pod Performance","Service Delivery","Regional Performance","Retention","Business Reports"],
"Administrator":["Admin Overview","Users & Roles","Organizations","Subscriptions & Plans","Service Catalogue","Pod Configuration","Regions & Currencies","Notifications","Integrations","Audit Logs","Platform Settings"]
};
const descriptions={"Overview":"Your business at a glance","My Workspace":"Your personal delivery workspace","Executive Overview":"GC3 business performance at a glance","Admin Overview":"Platform health and administration overview","My Subscription":"Manage your GC3 subscription and entitlements","Services":"Explore your available capabilities","Service Requests":"Track and manage service requests","Projects":"Monitor ongoing client engagements","My Projects":"Projects assigned to your account","Deliverables":"Review and access completed work","My Pod":"Your dedicated GC3 team","Messages":"Communication and collaboration","Team Members":"Manage your organization members","Billing & Invoices":"Your subscription and financial records","Knowledge Centre":"Resources, guides and documentation","Support":"Help and support","Settings":"Account preferences and configuration"};
let role="Client Owner",page="Overview",notice="",filter="All";
const records=[
{id:"GC3-1024",name:"Brand identity refresh",client:"Apex Healthcare",type:"Creative",owner:"Design Pod",state:"In Progress"},
{id:"GC3-1025",name:"Q4 social media campaign",client:"Northstar Group",type:"Digital",owner:"Marketing Pod",state:"Under Review"},
{id:"GC3-1026",name:"Corporate presentation",client:"Apex Healthcare",type:"Creative",owner:"Design Pod",state:"Submitted"},
{id:"GC3-1027",name:"Website landing page",client:"Vertex Labs",type:"Development",owner:"Web Pod",state:"New"}];
const metrics={
client:[["Active projects","08","+2 this month"],["Open requests","12","4 awaiting review"],["Hours available","86","Of 120 monthly hours"],["Deliverables","24","6 pending approval"]],
team:[["Active clients","09","Across assigned accounts"],["Open tasks","18","5 due this week"],["Utilization","78%","Team capacity"],["Deliverables","32","4 awaiting review"]],
sales:[["Active leads","248","+18 this month"],["Pipeline value","$184K","Qualified opportunities"],["Proposals","16","5 awaiting response"],["Conversions","12","This month"]],
ops:[["Active clients","42","Across all pods"],["Open requests","86","12 overdue"],["Pod utilization","82%","Global average"],["SLA compliance","96.4%","Current month"]],
exec:[["Monthly revenue","$184.2K","+12.8% vs previous"],["Active clients","142","+14 this month"],["Active subscriptions","156","Across all packages"],["Delivery performance","96.4%","SLA compliance"]]};
function group(){if(role.startsWith("Client"))return"client";if(role.startsWith("Pod"))return"team";if(role==="Sales Manager")return"sales";if(role==="Operations Manager")return"ops";return"exec"}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setNotice(s){notice=s;document.getElementById("notice").innerHTML=s?`<div class="notice">${esc(s)}</div>`:""}
function go(p){page=p;render()}
function render(){
document.getElementById("role").value=role;document.getElementById("toprole").textContent=role;document.getElementById("crumb").textContent="GC3 WORKSPACE / "+role.toUpperCase();document.getElementById("title").textContent=page;document.getElementById("subtitle").textContent=descriptions[page]||"Manage your GC3 workspace.";
document.getElementById("nav").innerHTML=roles[role].map((p,i)=>`<button class="${p===page?"active":""}" data-page="${esc(p)}"><span class="ico">${["▦","◫","◇","▤","▣","▧","♙","▤","◷","⚙"][i%10]}</span>${esc(p)}</button>`).join("");
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
setNotice(notice);
let v=document.getElementById("view");
if(["Overview","My Workspace","Executive Overview","Admin Overview"].includes(page)){let m=metrics[group()];v.innerHTML=`<div class="sub">Good afternoon. Here's your current workspace snapshot.</div><div class="grid">${m.map(x=>`<div class="metric"><div class="label">${x[0]}</div><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join("")}</div><div class="twocol"><div class="panel"><h3>Recent activity</h3>${records.slice(0,3).map(r=>activity(r.name,r.client+" · "+r.owner,r.state)).join("")}</div><div class="panel"><h3>Quick actions</h3><div class="quick"><button class="btn primary" data-go="${role.startsWith("Client")?"Service Requests":"My Tasks"}">＋ New request</button><button class="btn" data-go="Projects">▣ Projects</button><button class="btn" data-go="Messages">✉ Messages</button><button class="btn" data-go="Reports">▤ Reports</button></div></div></div>`}
else if(["Service Requests","My Tasks","Task Allocation","Leads","Client Accounts","Opportunities","Deliverables","My Projects","Projects","Assigned Projects","Companies","Proposals","Renewals"].includes(page)){v.innerHTML=`<div class="between"><div><b>${page}</b><div class="muted">Sample records for this workspace</div></div><button class="btn primary" id="create">＋ Create new</button></div><div class="tabs">${["All","In Progress","Under Review","Submitted"].map(x=>`<button class="${filter===x?"active":""}" data-filter="${x}">${x==="Under Review"?"Review":x}</button>`).join("")}</div><div id="records" class="recordlist"></div><div id="createbox"></div>`;document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.getElementById("create").onclick=()=>{document.getElementById("createbox").innerHTML=`<div class="panel formbox"><b>Create new record</b><label>Title<input id="newtitle" placeholder="Enter title"></label><label>Category<select id="newcat"><option>Creative</option><option>Digital</option><option>Development</option><option>Strategy</option></select></label><label>Description<textarea placeholder="Requirements..." rows="2"></textarea></label><button class="btn primary" id="save">Save record</button></div>`;document.getElementById("save").onclick=()=>{let n=document.getElementById("newtitle").value||"New service request";records.unshift({id:"GC3-"+(1028+records.length),name:n,client:"Apex Healthcare",type:document.getElementById("newcat").value,owner:"GC3 Team",state:"New"});setNotice("Sample record created.");render()}};fillRecords()}
else if(page==="My Subscription"||page==="Subscriptions"||page==="Subscriptions & Plans"){v.innerHTML=`<div class="panel"><span class="status green">ACTIVE</span><h2>$5,000 <span class="muted">/ month</span></h2><b>Design + Marketing Pod</b><p class="muted">Next renewal: 01 December 2026</p><hr><div class="between"><span>Included monthly hours</span><b>120 hrs</b></div><div class="between"><span>Utilized hours</span><b>86 hrs</b></div><div class="between"><span>Remaining hours</span><b>34 hrs</b></div><p><button class="btn" onclick="setNotice('Subscription details opened in preview.')">View subscription details</button></p></div><h3>Available packages</h3><div class="recordlist">${[["Design Pod","$2,000"],["Design + Marketing Pod","$5,000"],["Design + Marketing + Automation","$8,000"]].map(x=>`<div class="record between"><div><b>${x[0]}</b><div class="muted">${x[1]} / month</div></div><button class="btn small" onclick="setNotice('Package selected. Sales approval required.')">Explore</button></div>`).join("")}</div>`}
else if(page==="Services"||page==="Service Catalogue"){let s=[["Creative","Branding, graphic design, presentations and publications","✎"],["Digital","Digital marketing, campaigns and social media","◉"],["Interactive","AR, VR, XR, gamification and 3D","◇"],["Development","Websites, applications and CMS","⌘"],["Strategy","Business consulting and research","⌖"],["Learning","E-learning and instructional design","▣"],["Automation","AI integration and workflow automation","⟳"],["Back Office","Research and administrative support","▤"]];v.innerHTML=`<div class="services">${s.map(x=>`<div class="service"><div class="symbol">${x[2]}</div><div><b>${x[0]}</b><p>${x[1]}</p></div></div>`).join("")}</div>`}
else if(["My Pod","Pod Management","Pod Configuration","Team Members","Workforce"].includes(page)){v.innerHTML=`<h3>Team and pod directory</h3><div class="recordlist">${[["Design Pod","Creative production","3 members"],["Marketing Pod","Digital campaigns","2 members"],["Automation Pod","AI and automation","2 members"]].map(x=>`<div class="record"><div class="between"><b>${x[0]}</b><span class="status green">Active</span></div><p class="muted">${x[1]} · ${x[2]}</p><button class="btn small" onclick="setNotice('Viewing ${x[0]} details.')">View team</button></div>`).join("")}</div>`}
else if(page==="Messages"){v.innerHTML=`<div class="recordlist">${[["Design Pod","The updated brand concepts are ready for review.","10:42 AM"],["Account Manager","Your monthly service summary is available.","Yesterday"],["Marketing Team","Please review the campaign calendar.","Yesterday"]].map(x=>`<div class="record"><div class="between"><b>${x[0]}</b><span class="muted">${x[2]}</span></div><p class="muted">${x[1]}</p><button class="btn small" onclick="setNotice('Opening conversation with ${x[0]}.')">Open conversation</button></div>`).join("")}</div><div class="panel"><textarea id="message" placeholder="Write a message..."></textarea><p><button class="btn primary" onclick="setNotice('Sample message sent.')">Send message →</button></p></div>`}
else if(page==="Billing & Invoices"||page==="Revenue"){v.innerHTML=`<div class="grid"><div class="metric"><div class="label">Total invoiced</div><strong>$15,000</strong></div><div class="metric"><div class="label">Outstanding</div><strong>$0</strong></div></div><div class="panel"><h3>Recent invoices</h3>${[["INV-2026-104","01 Nov 2026","$5,000"],["INV-2026-091","01 Oct 2026","$5,000"],["INV-2026-078","01 Sep 2026","$5,000"]].map(x=>`<div class="activity"><div class="desc"><b>${x[0]}</b><small>${x[1]}</small></div><b>${x[2]}</b><span class="status green">Paid</span><button class="btn small" onclick="setNotice('Invoice selected.')">↓</button></div>`).join("")}</div>`}
else if(page==="Knowledge Centre"){v.innerHTML=`<div class="recordlist">${[["Getting started with GC3","Client onboarding and portal basics"],["How to submit a service request","Requirements and submission guidelines"],["Deliverable review guidelines","Reviews, revisions and approvals"],["Subscription guide","Packages, entitlements and renewals"]].map(x=>`<div class="record"><b>${x[0]}</b><p class="muted">${x[1]}</p></div>`).join("")}</div>`}
else if(page==="Support"){v.innerHTML=`<div class="panel formbox"><h3>How can we help?</h3><label>Issue subject<input placeholder="Issue subject"></label><label>Support category<select><option>Account access</option><option>Billing</option><option>Service delivery</option><option>Technical issue</option></select></label><label>Description<textarea rows="4" placeholder="Describe your issue..."></textarea></label><button class="btn primary" onclick="setNotice('Support ticket submitted in the sample interface.')">Submit support ticket</button></div>`}
else if(["Settings","My Profile","Platform Settings"].includes(page)){v.innerHTML=`<div class="panel formbox"><h3>Profile and preferences</h3><label>Full name<input value="Alex Morgan"></label><label>Email address<input value="alex@example.com"></label><label>Organization<input value="Apex Healthcare"></label><label>Country<input value="United States"></label><label><input type="checkbox" checked style="width:auto"> Email notifications</label><label><input type="checkbox" checked style="width:auto"> Project update notifications</label><button class="btn primary" onclick="setNotice('Sample preferences saved.')">Save changes</button></div>`}
else{v.innerHTML=`<div class="panel"><h3>Business intelligence & administration</h3><p class="muted">Illustrative reporting view for ${role}.</p><div class="tabs"><button class="active">This week</button><button>This month</button><button>This year</button></div>${[["Performance score","94.8%"],["Active records","142"],["Pending actions","18"],["Completed this period","86"]].map(x=>`<div class="activity"><div class="desc">${x[0]}</div><b>${x[1]}</b></div>`).join("")}</div><div class="panel"><h3>Pending actions</h3>${["Review pending approvals","Check overdue service requests","Review account performance"].map(x=>`<p><label><input type="checkbox" style="width:auto"> ${x}</label></p>`).join("")}</div>`}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function activity(a,b,c){return `<div class="activity"><div class="fileicon">▤</div><div class="desc"><b>${a}</b><small>${b}</small></div><span class="status ${c==="Submitted"?"green":c==="Under Review"?"amber":""}">${c}</span></div>`}
function fillRecords(){let q=document.getElementById("search").value.toLowerCase();let data=records.filter(r=>(filter==="All"||r.state===filter)&&[r.name,r.client,r.id,r.type].join(" ").toLowerCase().includes(q));document.getElementById("records").innerHTML=data.length?data.map(r=>`<div class="record"><div class="recordtop"><span class="muted">${r.id}</span><span class="status ${r.state==="Submitted"?"green":r.state==="Under Review"?"amber":""}">${r.state}</span></div><h3>${r.name}</h3><div class="muted">${r.client} · ${r.type} · ${r.owner}</div><div class="recordfoot"><button class="btn small" onclick="setNotice('Opened ${r.id}. This is sample data.')">View details</button><span class="muted">GC3 workspace</span></div></div>`).join(""):'<div class="panel muted">No matching records.</div>'}
document.getElementById("role").innerHTML=Object.keys(roles).map(r=>`<option>${r}</option>`).join("");
document.getElementById("role").addEventListener("change",e=>{role=e.target.value;page=roles[role][0];filter="All";notice="";render()});
document.getElementById("search").addEventListener("input",()=>{if(document.getElementById("records"))fillRecords()});
document.getElementById("notify").onclick=()=>setNotice("You are all caught up. No new notifications.");
render();
</script>
</body>
</html>
